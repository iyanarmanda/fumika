# Cron/schedule worfklow for Dependabot if `minimum-release-age` active
name: Rerun Failed Dependabot PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  rerun-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Rerun failed checks for Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --author "app/dependabot" --json number -q '.[].number')

          if [ -z "$prs" ]; then
            echo "No PR active from Dependabot."
            exit 0
          fi

          for pr in $prs; do
            echo "Checking PR #$pr..."
            
            failed_runs=$(gh pr view $pr --json statusCheckRollup -q '.statusCheckRollup[] | select(.conclusion=="FAILURE") | .workflowRun.id' | sort -u)

            for run_id in $failed_runs; do
              if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
                echo "Trigger rerun for workflow run ID: $run_id in PR #$pr"
                gh run rerun $run_id --failed
              fi
            done
          done
